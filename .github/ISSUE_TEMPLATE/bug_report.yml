name: Bug report
description: Something behaves incorrectly
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        **Security issues do not belong here** — see SECURITY.md and email
        security@elitesender.app instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the exact error message or screenshot if you have one.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations: { required: true }
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [local, staging, production]
    validations: { required: true }
