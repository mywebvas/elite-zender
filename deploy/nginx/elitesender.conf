###############################################################################
# EliteSender — nginx site configuration
#
# Replaces a stock template that served plain HTTP with no TLS, contradicted
# the application's X-Frame-Options: DENY with SAMEORIGIN, pointed at a PHP 8.3
# socket the app can no longer run on, and left client_max_body_size at the
# 1 MB default — silently 413ing every CSV import over that size while the
# application happily advertised a 20 MB limit.
###############################################################################

# Rate-limit zones. Shared across workers; sized for ~160k unique IPs per MB.
limit_req_zone $binary_remote_addr zone=elitesender_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=elitesender_auth:10m    rate=1r/s;

map $sent_http_content_type $elitesender_expires {
    default                 off;
    text/css                1y;
    application/javascript  1y;
    ~image/                 30d;
    ~font/                  1y;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # ACME renewal must stay on :80; everything else is redirected.
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name your-domain.com;
    root /srv/elitesender/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # CSP, HSTS, X-Frame-Options and friends are emitted by
    # App\Http\Middleware\SecurityHeaders so there is exactly one source of
    # truth. Duplicating them here is how a policy drifts.

    # CSV imports are validated at 20 MB in CsvImportController.
    client_max_body_size 24m;
    client_body_timeout  60s;

    # Compression. Brotli if the module is available, gzip always.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/manifest+json;

    # Vite emits content-hashed filenames, so these are immutable.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /icons/ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # The service worker must never be cached, or clients get stuck on an old
    # build forever.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; expires 30d; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Credential-stuffing surface gets its own, much tighter bucket.
    location ~ ^/(login|register|forgot-password|reset-password)$ {
        limit_req zone=elitesender_auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=elitesender_general burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS           on;
        include fastcgi_params;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Anything else ending in .php is not ours to execute.
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* { deny all; }
}
