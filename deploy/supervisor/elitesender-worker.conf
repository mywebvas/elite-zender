###############################################################################
# EliteSender — queue workers and scheduler
#
# The previous file ran a single generic worker with no --queue, so the lane
# priorities in docs/08 (high / default / low) were never honoured and a
# 500k-row CSV import could sit in front of a live campaign send. It also
# defined no scheduler at all, which is why daily SMTP quotas never reset.
###############################################################################

[program:elitesender-worker-high]
process_name=%(program_name)s_%(process_num)02d
; Sending lane. --max-time recycles the process so a long-lived worker cannot
; accumulate leaked state; --max-jobs bounds memory growth.
command=php /srv/elitesender/current/artisan queue:work redis --queue=high --sleep=1 --tries=3 --backoff=30 --max-time=3600 --max-jobs=1000
directory=/srv/elitesender/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/elitesender/worker-high.log
stdout_logfile_maxbytes=50MB
; Must exceed the longest job timeout so a graceful stop never truncates a send.
stopwaitsecs=3600

[program:elitesender-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /srv/elitesender/current/artisan queue:work redis --queue=default,low --sleep=3 --tries=3 --max-time=3600 --max-jobs=500
directory=/srv/elitesender/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/elitesender/worker-default.log
stdout_logfile_maxbytes=50MB
stopwaitsecs=1800

[program:elitesender-scheduler]
; Exactly one instance, ever: the scheduled commands use onOneServer() but that
; lock only protects against multiple hosts, not multiple local processes.
command=php /srv/elitesender/current/artisan schedule:work
directory=/srv/elitesender/current
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/elitesender/scheduler.log
stopwaitsecs=60

[group:elitesender]
programs=elitesender-worker-high,elitesender-worker-default,elitesender-scheduler
priority=999
